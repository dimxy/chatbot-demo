[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chatbot-demo"
version = "0.1.0"
description = "A human-like conversational bot built on LangGraph"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-ollama>=0.2",
    "qdrant-client[fastembed]>=1.9",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "langdetect>=1.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
chatbot = "main:main"

[tool.hatch.build.targets.wheel]
packages = ["bot"]
